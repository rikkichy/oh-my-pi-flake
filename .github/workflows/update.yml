name: update

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Release version to pin (defaults to the latest release)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      version: ${{ steps.bump.outputs.version }}
      digest: ${{ steps.bump.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22

      - name: rewrite package.nix
        id: bump
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nix run .#update -- "$VERSION"
          echo "version=$(sed -n 's/^  version = "\(.*\)";$/\1/p' package.nix)" >>"$GITHUB_OUTPUT"
          echo "digest=$(nix-hash --type sha256 --flat package.nix)" >>"$GITHUB_OUTPUT"
          if git diff --quiet -- package.nix; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

  verify:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    uses: ./.github/workflows/check.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      digest: ${{ needs.resolve.outputs.digest }}

  publish:
    needs: [resolve, verify]
    if: needs.resolve.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: DeterminateSystems/nix-installer-action@v22

      - name: rewrite package.nix
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          DIGEST: ${{ needs.resolve.outputs.digest }}
        run: |
          nix run .#update -- "$VERSION"
          actual=$(nix-hash --type sha256 --flat package.nix)
          if [ "$actual" != "$DIGEST" ]; then
            echo "package.nix hashes to $actual, run resolved $DIGEST; upstream assets moved mid-run" >&2
            exit 1
          fi

      - name: commit release
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if git diff --quiet -- package.nix; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.nix
          git commit -m "oh-my-pi: $VERSION"
          git push origin HEAD:master
